name: kccf-ministry-dev

services:
  app:
    build:
      context: .
      target: development
    image: kccf-ministry-app:local
    command: ["bun", "run", "scripts/dev.ts"]
    init: true
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./bun.lock:/app/bun.lock:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml:ro
      - ./.gitignore:/app/.gitignore:ro
      - ./.dockerignore:/app/.dockerignore:ro
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3000/health'); process.exit(response.ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  node_modules:
